# Reverse proxy — production routing (Phase 12)
# Routes: / -> web, /api -> api, /socket.io -> realtime

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # Upstream blocks defined in Phase 12
  # upstream api { server api:3001; }
  # upstream web { server web:3000; }
  # upstream realtime { server realtime:3002; }

  server {
    listen 80;
    server_name localhost;

    location /health {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # Placeholder — full routing in Phase 12
    location / {
      return 503 'Marketplace nginx — configure upstreams in Phase 12';
      add_header Content-Type text/plain;
    }
  }
}
